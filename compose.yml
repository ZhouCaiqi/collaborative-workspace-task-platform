services:
  # ============ 数据库服务 ============
  db:
    image: mysql:9.7.2
    container_name: task_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"             # 宿主机3307 → 容器3306，避免与本地MySQL冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 限流计数是短期数据：/data使用tmpfs且禁用RDB/AOF，不使用持久化Docker volume；容器停止或重建会清空窗口。
  redis:
    image: redis:7.4.2-alpine
    container_name: task_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============ API 服务 ============
  api:
    build: .
    container_name: task_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Compose 从根目录 .env 插值；这里只向 API 注入运行必需变量
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-task-api:rate-limit:v1}
      RATE_LIMIT_LOGIN_LIMIT: ${RATE_LIMIT_LOGIN_LIMIT:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      RATE_LIMIT_REGISTER_LIMIT: ${RATE_LIMIT_REGISTER_LIMIT:-3}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_WRITE_LIMIT: ${RATE_LIMIT_WRITE_LIMIT:-60}
      RATE_LIMIT_WRITE_WINDOW_SECONDS: ${RATE_LIMIT_WRITE_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_FAILURE_POLICY: ${RATE_LIMIT_AUTH_FAILURE_POLICY:-closed}
      RATE_LIMIT_WRITE_FAILURE_POLICY: ${RATE_LIMIT_WRITE_FAILURE_POLICY:-open}
    depends_on:
      db:
        condition: service_healthy   # 关键：等待 db 健康检查通过才启动
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

# ============ 持久化卷 ============
volumes:
  mysql_data:
